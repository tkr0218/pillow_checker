AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  花あつめ 通知サーバーの初回準備。GitHub Actions から AWS に入るための OIDC プロバイダーと
  デプロイ専用ロール、SAM の成果物を置く S3 バケットを作る。AWS コンソールの CloudFormation から一度だけ作成する。

Parameters:
  GitHubRepo:
    Type: String
    Default: tkr0218/pillow_checker
    Description: デプロイを許可するリポジトリ（owner/name）。main ブランチからだけ許可する
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: このアカウントに GitHub の OIDC プロバイダーがまだ無ければ true（既にあれば false）

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1, 1c58a3a8518e8759bf075b76b750d4f2df264fcd]

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      LifecycleConfiguration: { Rules: [{ Id: expire, Status: Enabled, ExpirationInDays: 30 }] }

  # GitHub Actions だけが使えるデプロイ用ロール。触れるのは名前が hana-notify で始まるリソースだけ
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hana-notify-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:ref:refs/heads/main
      Policies:
        - PolicyName: deploy-hana-notify
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Stack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/hana-notify/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: StackRead
                Effect: Allow
                Action: [cloudformation:ValidateTemplate, cloudformation:GetTemplateSummary]
                Resource: "*"
              - Sid: Artifacts
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:ListBucket, s3:GetBucketLocation]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub "${ArtifactBucket.Arn}/*"]
              - Sid: Functions
                Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:hana-notify-*
              - Sid: Roles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/hana-notify-*
              - Sid: PassRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/hana-notify-*
                Condition:
                  StringEquals:
                    iam:PassedToService: [lambda.amazonaws.com, scheduler.amazonaws.com]
              - Sid: Table
                Effect: Allow
                Action: dynamodb:*
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/hana-notify
              - Sid: Schedule
                Effect: Allow
                Action: [scheduler:CreateSchedule, scheduler:UpdateSchedule, scheduler:DeleteSchedule, scheduler:GetSchedule, scheduler:TagResource]
                Resource: !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/hana-notify-*
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:DeleteLogGroup, logs:PutRetentionPolicy, logs:DeleteRetentionPolicy, logs:TagResource, logs:TagLogGroup, logs:ListTagsForResource]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/hana-notify-*
              - Sid: LogsRead
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"

Outputs:
  RoleArn:
    Description: GitHub の変数 AWS_ROLE_ARN に設定する
    Value: !GetAtt DeployRole.Arn
  ArtifactBucketName:
    Description: GitHub の変数 AWS_ARTIFACT_BUCKET に設定する
    Value: !Ref ArtifactBucket
